name: Mantener activa la demo

# El plan gratis de Supabase pausa los proyectos sin actividad. Un pedido por día alcanza.
# Usa variables del repo (no secretos: la URL y la publishable key son públicas).
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_URL != ''
    steps:
      - name: Consulta a la base
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Un 401 no alcanzó: el 2026-09-29 Supabase pausó el proyecto igual. La RPC ping
          # (lo único que anon puede ejecutar) hace una consulta real y tiene que dar 200 y true.
          respuesta=$(curl -s -w '\n%{http_code}' --max-time 30 -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' \
            -d '{}' "$SUPABASE_URL/rest/v1/rpc/ping")
          codigo=$(echo "$respuesta" | tail -n 1)
          cuerpo=$(echo "$respuesta" | head -n -1)
          echo "HTTP $codigo: $cuerpo"
          test "$codigo" = 200 -a "$cuerpo" = true
